<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>

    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters & Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .pulse-line {
      stroke-dasharray: 8, 12;
      animation: dashMove 20s linear infinite;
    }
    .flow-packet-1 {
      animation: flowAcross1 7s ease-in-out infinite;
    }
    .flow-packet-2 {
      animation: flowAcross2 9s ease-in-out infinite;
    }
    .flow-packet-3 {
      animation: flowAcross3 6s ease-in-out infinite;
    }
    .floating-card {
      animation: floatMotion 6s ease-in-out infinite alternate;
    }
    .floating-card-reverse {
      animation: floatMotionRev 7s ease-in-out infinite alternate;
    }

    @keyframes dashMove {
      to {
        stroke-dashoffset: -200;
      }
    }
    @keyframes flowAcross1 {
      0% { transform: translate(120px, 60px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translate(1050px, 120px); opacity: 0; }
    }
    @keyframes flowAcross2 {
      0% { transform: translate(150px, 300px); opacity: 0; }
      20% { opacity: 0.7; }
      80% { opacity: 0.7; }
      100% { transform: translate(950px, 280px); opacity: 0; }
    }
    @keyframes flowAcross3 {
      0% { transform: translate(300px, 320px); opacity: 0; }
      50% { opacity: 0.9; }
      100% { transform: translate(880px, 70px); opacity: 0; }
    }
    @keyframes floatMotion {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
    @keyframes floatMotionRev {
      0% { transform: translateY(0px); }
      100% { transform: translateY(12px); }
    }
  </style>

  <!-- Deep High-Tech Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />

  <!-- Animated Background Grid / Connectors -->
  <g opacity="0.25">
    <path d="M 0 60 H 1200 M 0 120 H 1200 M 0 180 H 1200 M 0 240 H 1200 M 0 300 H 1200" stroke="#334155" stroke-width="1" />
    <path d="M 150 0 V 360 M 300 0 V 360 M 450 0 V 360 M 600 0 V 360 M 750 0 V 360 M 900 0 V 360 M 1050 0 V 360" stroke="#334155" stroke-width="1" />
  </g>

  <!-- Animated Flow Paths (Background layer) -->
  <g opacity="0.6">
    <path class="pulse-line" d="M 120 70 Q 300 30, 600 80 T 1080 70" fill="none" stroke="#00f2fe" stroke-width="2" />
    <path class="pulse-line" d="M 100 290 Q 400 330, 700 280 T 1100 290" fill="none" stroke="#4facfe" stroke-width="2" />
    <path class="pulse-line" d="M 150 180 C 400 60, 800 300, 1050 180" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
  </g>

  <!-- Flow Packets moving along streams -->
  <circle class="flow-packet-1" cx="0" cy="0" r="4" fill="#00f2fe" filter="url(#glow)" />
  <circle class="flow-packet-2" cx="0" cy="0" r="5" fill="#38bdf8" filter="url(#glow)" />
  <circle class="flow-packet-3" cx="0" cy="0" r="3" fill="#ffb199" filter="url(#glow)" />

  <!-- Background Decorative BPMN / Micro-service Process Cards (Behind Title) -->
  <g class="floating-card" opacity="0.4" transform="translate(60, 40)">
    <rect width="130" height="42" rx="8" fill="url(#nodeGrad)" stroke="#00f2fe" stroke-width="1" />
    <text x="65" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚙️ BPMN 2.0</text>
  </g>

  <g class="floating-card-reverse" opacity="0.4" transform="translate(1010, 45)">
    <rect width="130" height="42" rx="8" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="1" />
    <text x="65" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ Orchestration</text>
  </g>

  <g class="floating-card" opacity="0.35" transform="translate(90, 260)">
    <rect width="130" height="42" rx="8" fill="url(#nodeGrad)" stroke="#818cf8" stroke-width="1" />
    <text x="65" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🤖 RPA &amp; DMN</text>
  </g>

  <g class="floating-card-reverse" opacity="0.35" transform="translate(980, 260)">
    <rect width="140" height="42" rx="8" fill="url(#nodeGrad)" stroke="#34d399" stroke-width="1" />
    <text x="70" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🚀 Event-Driven</text>
  </g>

  <!-- FOREGROUND: Main Title & Subtitle Badge -->
  <!-- Dark translucent backing shield to guarantee 100% foreground contrast and legibility -->
  <rect x="190" y="70" width="820" height="210" rx="16" fill="#060c18" fill-opacity="0.75" stroke="#1e293b" stroke-width="1.5" />

  <!-- Top Pill / Badge -->
  <g transform="translate(600, 105)">
    <rect x="-160" y="-14" width="320" height="28" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
    <circle cx="-135" cy="0" r="4" fill="#10b981" />
    <text x="5" y="4.5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">CURATED AWESOME ECOSYSTEM</text>
  </g>

  <!-- Main Headline Title -->
  <text x="600" y="165" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" text-anchor="middle">
    Business Process Automation (BPA)
  </text>

  <!-- Subtitle with Gradient highlight -->
  <text x="600" y="202" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" letter-spacing="0.5" text-anchor="middle">
    Enterprise SaaS &amp; Open-Source Workflow Orchestration
  </text>

  <!-- Supporting Tagline -->
  <text x="600" y="235" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" letter-spacing="0.2" text-anchor="middle">
    BPMN 2.0 • Code-First Durable Execution • DMN Decisioning • Low-Code Automation
  </text>

  <!-- Bottom Accent Line -->
  <rect x="450" y="258" width="300" height="3" rx="1.5" fill="url(#primaryGrad)" />
</svg>
